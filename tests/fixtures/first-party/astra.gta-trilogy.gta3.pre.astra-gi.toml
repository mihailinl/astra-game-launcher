# astra-gi-gta3.toml (schema 1, astra-bepinex/docs/GAME-INTEGRATION-MANIFEST.md; read by astra-game-launcher).
#
# "Astra for GTA III - The Definitive Edition", phase 1 / DISCOVERY BUILD. This is a SEPARATE integration
# from astra-reshade's generic Unreal runner (astra-gi.toml, `exe = "*"`) - the owner's ruling: no GTA logic
# in the generic foundation. GTA: The Trilogy - The Definitive Edition (GTA III / Vice City / San Andreas, all
# on Rockstar's modified UE 4.26 "Gameface") needs its own code because the generic runner only partly works
# on it: UE4SS's own pattern scan is ambiguous on these exes (game-signatures/README.md explains why and ships
# the two overrides this manifest installs), the player controller never possesses a Pawn (AstraGTA's
# player_actor() falls back to the view target), the gameplay view target is a far-away default actor, and UE
# line traces never hit GTA's own collision (Rockstar's, not Unreal's). This build adds DISCOVERY MODE (on by
# default - AstraGTA/Scripts/main.lua, M.DISCOVERY) so one supervised run tells us how the game represents its
# player before any GTA-specific positioning logic gets written.
#
# `[target]` pins this exe (and its Steam appid) - exactly the safety property game-signatures/README.md relies
# on: a Lua `UE4SS_Signatures/<Symbol>.lua` override REPLACES UE4SS's built-in scan for that symbol outright
# (it does not fall back if the override's AOB finds nothing), so a GTA-III-specific byte pattern must never
# reach any other Unreal game's copy of ue4ss/ - an exe-pinned manifest is what makes that safe with no
# launcher change (src/plan.rs::plan_install already refuses a mismatched exe/appid, GAME_MISMATCH).
#
# Same build, same upstream pins (UE4SS, ReShade 6.8.0 Addon) and the same `[launch]`/`[[config_writes]]` shape
# as astra-reshade's own runner manifests - built by tools/package-gta.sh from extern/astra-reshade's own
# compositor + AstraGTA (this repo's own copy of AstraUE, never edited in astra-reshade - see AstraGTA's header
# for what changed: the discovery block, and nothing in the generic camera path).
schema = 1

[integration]
id = "astra.gta-trilogy.gta3"
name = "Astra for GTA III - The Definitive Edition"
version = "0.1.0-discovery"
authors = ["mihailinl"]
license = "MIT AND BSD-3-Clause AND CC0-1.0" # ours and UE4SS: MIT; ReShade: BSD-3-Clause; ReShade.fxh: CC0-1.0
repo = "https://github.com/mihailinl/astra-gta-trilogy"

[target]
# engine = "unreal" intentionally OMITTED: astra-game-launcher plan_install (src/plan.rs) checks it with
# detect::engine_of_exe, whose only Unreal rule (src/detect.rs::unreal) requires the exe name to end
# "-Win64-Shipping.exe" - Rockstar's Gameface build does not follow that convention (this game's own
# exe above has no such suffix), so the check would always report engine-mismatch on a real install.
# [target].exe + steam_appid already fully pin this game (GAME_MISMATCH refuses anything else); the
# engine check adds no extra safety here, only a false refusal. Confirmed with the launcher CLI against
# a scratch fake layout, 2026-10-20 (plan/install/launch --dry-run/uninstall all succeed without it).
exe = "Gameface/Binaries/Win64/LibertyCity.exe"
steam_appid = 1546970
platforms = ["windows-x64", "linux-proton"]
anti_cheat = "none"

# ---- the game folder: the real exe's folder (Gameface/Binaries/Win64, beside LibertyCity.exe) ----

# UE4SS's proxy (upstream, unmodified)
[[game_files]]
from = "dwmapi.dll"
to = "${game}/dwmapi.dll"
sha256 = "3f11fad958a959dd7ab78ab0b42be90e33f8ef8e152fbdc3c8e4278cb590e6cc"

# UE4SS, whole, beside the exe in its own layout (ue4ss/) - UE4SS 3.x's own layout (docs.ue4ss.com), the same
# reason astra-reshade's runner ships it there and not the profile (some games' own launcher does not forward
# --ue4ss-path to the real exe).
[[game_files]]
from = "ue4ss/LICENSE"

[launch]
# --ue4ss-path: harmless, not load-bearing - UE4SS.dll ships beside the exe (${game}/ue4ss/, above) where the
# proxy finds it on its own. -AstraConfig: the ini below, where the add-on reads the engine's port and this
# session's token - its PATH only, never the token. Each path is its own argument (a Windows path, Z:\... under
# Proton).
args = ["--ue4ss-path", "${game}/ue4ss/UE4SS.dll", "-AstraConfig", "${profile}/astra-reshade.ini"]
proton_dll_overrides = { dwmapi = "native,builtin", dxgi = "native,builtin" }

# written at every Play, in the profile only; the add-on reads [bridge] (astra-reshade's src/config.h)
[[config_writes]]
file = "${profile}/astra-reshade.ini"
section = "bridge"
set = { Port = "${bridge_port}", Token = "${bridge_token}" }

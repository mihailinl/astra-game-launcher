# astra-gi-gta3.toml (schema 1, astra-bepinex/docs/GAME-INTEGRATION-MANIFEST.md; read by astra-game-launcher).
# "Astra for GTA III - The Definitive Edition": NOT the runner (astra-gi.toml, `exe = "*"`) - this manifest
# pins `[target] exe` and `steam_appid` to this one game, so the launcher refuses it on any other exe
# (src/plan.rs::plan_install, GAME_MISMATCH) the same way it already refuses a mismatched appid. That pin is
# what makes it SAFE to add the two UE4SS_Signatures/ files from game-signatures/GTA3-DefinitiveEdition/ (see its
# sibling README.md for why): they replace UE4SS's own pattern scan outright for this game's exe, and must never
# reach any OTHER Unreal game's copy of ue4ss/ - which the shared runner's ue4ss-overlay/ cannot promise, but an
# exe-pinned manifest can, with NO launcher change needed.
#
# Everything else below is the SAME as astra-gi.toml - same build, same upstream pins, same launch args, same
# "UE4SS beside the exe, not the profile" reasoning (see the comment at the top of that file) - by deliberate
# near-duplication: this manifest schema has no include/extends, and the two are independently selectable
# packages a player picks between in the launcher, not one layered on the other. Touch BOTH files together for
# anything that is not the `[target]`/UE4SS_Signatures difference below (tools/package-unreal.sh stages this
# package from the SAME build of astra.addon64/ReShade/UE4SS as astra-gi.toml, plus this manifest's own extra
# UE4SS_Signatures files, so a digest drift between the two would fail the build, not a player's install).
schema = 1

[integration]
id = "astra.unreal.gta3-definitive-edition"
name = "Astra for GTA III - The Definitive Edition"
version = "0.2.11"
authors = ["mihailinl"]
license = "MIT AND BSD-3-Clause AND CC0-1.0" # ours and UE4SS: MIT; ReShade: BSD-3-Clause; ReShade.fxh: CC0-1.0
repo = "https://github.com/mihailinl/astra-reshade"

[target]
engine = "unreal"
exe = "Gameface/Binaries/Win64/LibertyCity.exe"
steam_appid = 1546970
platforms = ["windows-x64", "linux-proton"]
anti_cheat = "none"

# ---- the game folder: the real exe's folder (Gameface/Binaries/Win64, beside LibertyCity.exe) ----

# UE4SS's proxy (upstream, unmodified)
[[game_files]]
from = "dwmapi.dll"
to = "${game}/dwmapi.dll"
sha256 = "3f11fad958a959dd7ab78ab0b42be90e33f8ef8e152fbdc3c8e4278cb590e6cc"

# UE4SS, whole, beside the exe in its own layout (ue4ss/) - same files, same digests as astra-gi.toml (see the
# comment at the top of that file for why it lives here and not the profile).
[[game_files]]
from = "ue4ss/LICENSE"

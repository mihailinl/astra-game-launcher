# astra-gi.toml (schema 1, astra-bepinex/docs/GAME-INTEGRATION-MANIFEST.md; read by astra-game-launcher).
# "Astra for any Unreal Engine game": a RUNNER (no appid; the user picks the game, the launcher checks it is
# Unreal). Two upstream loaders and our two pieces, all in the game's process:
#   UE4SS (MIT)        its proxy dwmapi.dll beside the game's exe; UE4SS itself + our AstraUE Lua mod in the PROFILE
#   ReShade (BSD-3)    its proxy dxgi.dll beside the game's exe (and ReShade.fxh, CC0)
#   astra.addon64      our ReShade add-on (MIT) + AstraPassthrough.fx: composites her with the game's depth
#   AstraUE            our UE4SS Lua mod (MIT): the game's camera and the player -> the add-on, every frame
# tools/package-unreal.sh builds astra-gi.zip from this file: it fills in the digests of OUR files (they change
# with every build); the upstream digests below are fixed by the pinned releases. Every file placed beside the
# game's exe carries a digest (tools/gi-pack.py refuses one without).
#
# No ReShade.ini ships: ReShade rewrites it while the game runs, and the launcher checks every file it placed
# against its digest at each Play. ReShade's defaults find the add-on (AddonPath defaults to ReShade's own folder,
# so astra.addon64 sits beside dxgi.dll), and the add-on sets at load what her effect needs and the defaults lack
# (src/config_rules.h: her shaders' folder in EffectSearchPaths, PresetPath, TutorialProgress), only where missing.
schema = 1

[integration]
id = "astra.unreal"
name = "Astra for any Unreal Engine game"
version = "0.2.0"
authors = ["mihailinl"]
license = "MIT AND BSD-3-Clause AND CC0-1.0" # ours and UE4SS: MIT; ReShade: BSD-3-Clause; ReShade.fxh: CC0-1.0
repo = "https://github.com/mihailinl/astra-reshade"

[target]
engine = "unreal"
exe = "*"
platforms = ["windows-x64", "linux-proton"]
anti_cheat = "none"

# UE4SS (RE-UE4SS experimental build 3.0.1-1164-g5e627997, 2026-10-09: the first line with UE 5.6-5.8), whole, into
# the profile. Its UE4SS.dll is loaded from there by the proxy's --ue4ss-path (below); its settings and Mods/ sit
# beside it. Our mods.txt turns UE4SS's own example mods off (console/cheat enablers) and AstraUE on.
[[files]]
from = "ue4ss/**"
to = "${profile}/ue4ss/"

# ---- the game folder: the real exe's folder (<Project>/Binaries/Win64, beside <Project>-Win64-Shipping.exe) ----

# UE4SS's proxy (upstream, unmodified)
[[game_files]]
from = "dwmapi.dll"
to = "${game}/dwmapi.dll"
sha256 = "3f11fad958a959dd7ab78ab0b42be90e33f8ef8e152fbdc3c8e4278cb590e6cc"

# ReShade 6.8.0 with full add-on support: ReShade64.dll from ReShade_Setup_6.8.0_Addon.exe, renamed (upstream, unmodified)
[[game_files]]
from = "dxgi.dll"
to = "${game}/dxgi.dll"
sha256 = "0cee63f9c9f13f3ac909c5b4903f4dbb4b719a7ab3b4f13b0deaf83c814b94f7"

# our add-on, beside dxgi.dll: ReShade loads add-ons from its own folder when no ReShade.ini says otherwise
[[game_files]]
from = "astra.addon64"
to = "${game}/astra.addon64"
sha256 = "3ba2e7a2021163f213849836464d5840c4661960d0d0e9917cb0eddbeda01721"

[[game_files]]
from = "astra-reshade/Shaders/AstraPassthrough.fx"
to = "${game}/astra-reshade/Shaders/AstraPassthrough.fx"
sha256 = "903bf75c450ea9ceb4ad3c266894c0c202b5948e42095e37f877bb1f2a9ebf67"

# the effect's game hooks: the foundation's own, empty (a game integration ships its own in place of it)
[[game_files]]
from = "astra-reshade/Shaders/AstraGame.fxh"
to = "${game}/astra-reshade/Shaders/AstraGame.fxh"
sha256 = "e7592a656d8251ca18eafbec5e788c5df1cd7aee56c55f6de6401fb1a9cb10f0"

# ReShade's shader header (crosire/reshade-shaders, branch slim at fd00221, CC0-1.0; upstream, unmodified)
[[game_files]]
from = "astra-reshade/Shaders/ReShade.fxh"
to = "${game}/astra-reshade/Shaders/ReShade.fxh"
sha256 = "6dabfbbaf968c3871905d2ea17f96572ff7b1cec01310b5d0e5252b66b30174f"

[launch]
# --ue4ss-path: UE4SS from the profile (the game folder gets only its proxy). -AstraConfig: the ini below, where the
# add-on reads the engine's port and this session's token - its PATH only, never the token (an UE game ignores both;
# a Steam launch carries arguments, not environment). Each path is its own argument, so the launcher writes it as a
# Windows path (Z:\... under Proton).
args = ["--ue4ss-path", "${profile}/ue4ss/UE4SS.dll", "-AstraConfig", "${profile}/astra-reshade.ini"]
proton_dll_overrides = { dwmapi = "native,builtin", dxgi = "native,builtin" }

# written at every Play, in the profile only; the add-on reads [bridge] (src/config.h)
[[config_writes]]
file = "${profile}/astra-reshade.ini"
section = "bridge"
set = { Port = "${bridge_port}", Token = "${bridge_token}" }

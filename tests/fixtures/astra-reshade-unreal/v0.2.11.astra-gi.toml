# astra-gi.toml (schema 1, astra-bepinex/docs/GAME-INTEGRATION-MANIFEST.md; read by astra-game-launcher).
# "Astra for any Unreal Engine game": a RUNNER (no appid; the user picks the game, the launcher checks it is
# Unreal). Two upstream loaders and our two pieces, all in the game's process:
#   UE4SS (MIT)        its proxy dwmapi.dll AND UE4SS itself + our AstraUE Lua mod, all beside the game's exe
#                       (UE4SS 3.x's own layout: ue4ss/UE4SS.dll - see the [[game_files]] block below)
#   ReShade (BSD-3)    its proxy dxgi.dll beside the game's exe (and ReShade.fxh, CC0)
#   astra.addon64      our ReShade add-on (MIT) + AstraPassthrough.fx: composites her with the game's depth
#   AstraUE            our UE4SS Lua mod (MIT): the game's camera and the player -> the add-on, every frame
# tools/package-unreal.sh builds astra-gi.zip from this file: it fills in the digests of OUR files (they change
# with every build); the upstream digests below are fixed by the pinned releases. Every file placed beside the
# game's exe carries a digest (tools/gi-pack.py refuses one without).
#
# UE4SS lives beside the exe, not in the profile, because some games' OWN launcher starts the real exe itself
# without forwarding the arguments we asked Steam to launch with (Poppy Playtime's PlaytimeLauncher does exactly
# this - UE4SS's proxy then found no --ue4ss-path and no ue4ss/UE4SS.dll next to it, "UE4SS Error: Failed to load
# UE4SS.dll"). UE4SS 3.x's own proxy_generator (RE-UE4SS/UE4SS/proxy_generator/main.cpp) tries, in order:
# --ue4ss-path (if given), an override.txt beside the exe (we ship neither), then `<exe folder>/ue4ss/UE4SS.dll`,
# then a bare UE4SS.dll - so shipping the real ue4ss/ tree beside the exe makes the proxy find it UNAIDED, argv or
# not. [launch].args below still passes --ue4ss-path pointed at this same location, so it stays harmless (not
# required, not wrong) if a game's launcher DOES forward it. UE4SS writes its own files into ue4ss/ at runtime
# (UE4SS.log, caches): none of that is in the [[game_files]] list below, so the launcher's digest check (only the
# files IT placed) never sees them, and an uninstall never removes them - they are left behind, like ReShade's own
# log. src/config.cpp's -AstraConfig has the matching half: when a launcher drops OUR OWN argv the add-on finds
# its ini without any, from SteamAppId.
#
# No ReShade.ini ships: ReShade rewrites it while the game runs, and the launcher checks every file it placed
# against its digest at each Play. ReShade's defaults find the add-on (AddonPath defaults to ReShade's own folder,
# so astra.addon64 sits beside dxgi.dll), and the add-on sets at load what her effect needs and the defaults lack
# (src/config_rules.h: her shaders' folder in EffectSearchPaths, PresetPath, TutorialProgress), only where missing.
#
# This runner's `exe = "*"` means UE4SS's OWN pattern scan has to work unaided - there is no per-game signature
# override here, and there must never be one added to ue4ss-overlay/: a Lua UE4SS_Signatures/*.lua override
# REPLACES UE4SS's built-in scan for that symbol outright (it does not fall back if the override's AOB finds
# nothing - UE4SS/src/Signatures.cpp, "so that the Lua script can perform the aob scan INSTEAD OF the Unreal
# API itself"), so a GTA-III-specific byte pattern shipped here would break every OTHER Unreal game this runner
# serves. A game whose scan fails (GTA III DE: see game-signatures/README.md) gets its OWN exe-pinned manifest
# instead - astra-gi-gta3.toml is the first one.
schema = 1

[integration]
id = "astra.unreal"
name = "Astra for any Unreal Engine game"
version = "0.2.11"
authors = ["mihailinl"]
license = "MIT AND BSD-3-Clause AND CC0-1.0" # ours and UE4SS: MIT; ReShade: BSD-3-Clause; ReShade.fxh: CC0-1.0
repo = "https://github.com/mihailinl/astra-reshade"

[target]
engine = "unreal"
exe = "*"
platforms = ["windows-x64", "linux-proton"]
anti_cheat = "none"

# ---- the game folder: the real exe's folder (<Project>/Binaries/Win64, beside <Project>-Win64-Shipping.exe) ----

# UE4SS's proxy (upstream, unmodified)
[[game_files]]
from = "dwmapi.dll"
to = "${game}/dwmapi.dll"
sha256 = "3f11fad958a959dd7ab78ab0b42be90e33f8ef8e152fbdc3c8e4278cb590e6cc"

# UE4SS (RE-UE4SS experimental build 3.0.1-1164-g5e627997, 2026-10-09: the first line with UE 5.6-5.8), whole,
# beside the exe in its OWN layout (ue4ss/) - see the comment at the top of this file for why. Every file is its
# own [[game_files]] entry because the schema has no digested-folder rule (only `[[files]]`, into the profile,
# takes a `dir/**` glob). Upstream files (UE4SS's own release, unmodified) are pinned fixed, exactly like
# dwmapi.dll above; our four - Mods/mods.txt + Mods/mods.json (turn UE4SS's own example mods off, console/cheat
# enablers, and AstraUE on) and Mods/AstraUE/** (our Lua mod) - are auto-filled like astra.addon64 below.
[[game_files]]
from = "ue4ss/LICENSE"
to = "${game}/ue4ss/LICENSE"
sha256 = "99e1d8f8b7cb68e8b2313380ae3b0c8115e39dfbc443fcf21fd67ab74ce1d57e"


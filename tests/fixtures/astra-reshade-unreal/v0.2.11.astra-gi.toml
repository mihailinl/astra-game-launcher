to = "${game}/astra-reshade/Shaders/ReShade.fxh"
sha256 = "6dabfbbaf968c3871905d2ea17f96572ff7b1cec01310b5d0e5252b66b30174f"

[launch]
# --ue4ss-path: harmless, not load-bearing - UE4SS.dll now ships beside the exe (${game}/ue4ss/, above) where the
# proxy finds it on its own; this just points at that same copy so an explicit path never goes stale if a game's
# launcher DOES forward argv. -AstraConfig: the ini below, where the add-on reads the engine's port and this
# session's token - its PATH only, never the token (an UE game ignores both; a Steam launch carries arguments, not
# environment); when a launcher does NOT forward this, src/config.cpp finds the same ini via SteamAppId instead.
# Each path is its own argument, so the launcher writes it as a Windows path (Z:\... under Proton).
args = ["--ue4ss-path", "${game}/ue4ss/UE4SS.dll", "-AstraConfig", "${profile}/astra-reshade.ini"]
proton_dll_overrides = { dwmapi = "native,builtin", dxgi = "native,builtin" }

# written at every Play, in the profile only; the add-on reads [bridge] (src/config.h)
[[config_writes]]
file = "${profile}/astra-reshade.ini"
section = "bridge"
set = { Port = "${bridge_port}", Token = "${bridge_token}" }

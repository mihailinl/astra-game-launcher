#
# Built-in mod loaders for Unreal, as `astra.engine/1` `mods` data (engine-descriptor-v1.md §7).
# Appended to src/engines/builtin/unreal.toml and read with it as one descriptor (src/mods/builtin.rs).
# The launcher's own copy: tests/mods_identity.rs holds its `mods` member for member to the
# specification's golden `testdata/games/descriptors/mods/builtin/unreal.mods.toml` at the pin
# (vendored as test data only, under its own licence).
#
# Every path holds `{project}`, which only a strong rule binds: a game a weak rule places binds
# none, and these loaders yield nothing for it (§7.3).
schema = "astra.engine/1"

# UE4SS 3: beside the game's real program, with its own proxy (`dwmapi.dll`, on some installs
# `xinput1_3.dll`) — only inside an `any`, since a proxy's name never recognises a loader (§7.4).
[[mods.loader]]
id = "ue4ss3"
name = "UE4SS 3"
codes = ["unreal"]
source = ["game"]
require = [
  { stat = "{source}/{project}/Binaries/Win64/ue4ss/UE4SS.dll", kind = "file" },
  { stat = "{source}/{project}/Binaries/Win64/ue4ss/UE4SS-settings.ini", kind = "file" },
  { any = [
      { stat = "{source}/{project}/Binaries/Win64/dwmapi.dll", kind = "file" },
      { stat = "{source}/{project}/Binaries/Win64/xinput1_3.dll", kind = "file" },
  ] },
]
version = { pe = "{source}/{project}/Binaries/Win64/ue4ss/UE4SS.dll", key = ["ProductVersion", "FileVersion"], template = "N{1,2}.N{1,3}.N{1,3}", versions = ">=3, <4" }
root = "{source}/{project}/Binaries/Win64/ue4ss/Mods"
# `mods.txt` (`Name : 1` / `Name : 0`), or an `enabled.txt` in the mod's own folder.
enabled = [ { format = "enable-list", list = "{source}/{project}/Binaries/Win64/ue4ss/Mods/mods.txt", line = "name-colon-flag", marker = "enabled.txt" } ]
# Astra's loader loads THEIR UE4SS.dll in place of its own and adds its profile's Mods folder
# through UE4SS_MODS_PATHS, in-process: nothing is written into their folder.
coexist = [ { strategy = "chain", entry = "{source}/{project}/Binaries/Win64/ue4ss/UE4SS.dll", tell = "ue4ss-mods-paths" } ]

# UE4SS 2: beside the program itself. Recognised, so the player is told why "with your mods" is
# not offered; Astra's Unreal runner needs UE4SS 3's Lua API, so it cannot run beside it.
[[mods.loader]]
id = "ue4ss2"
name = "UE4SS 2"
codes = ["unreal"]
source = ["game"]
require = [
  { stat = "{source}/{project}/Binaries/Win64/UE4SS.dll", kind = "file" },
  { stat = "{source}/{project}/Binaries/Win64/UE4SS-settings.ini", kind = "file" },
]
version = { pe = "{source}/{project}/Binaries/Win64/UE4SS.dll", key = ["ProductVersion", "FileVersion"], template = "N{1,2}.N{1,3}.N{1,3}", versions = ">=2, <3" }
root = "{source}/{project}/Binaries/Win64/Mods"
enabled = [ { format = "enable-list", list = "{source}/{project}/Binaries/Win64/Mods/mods.txt", line = "name-colon-flag", marker = "enabled.txt" } ]
coexist = []

# The engine's own `~mods` paks: no loader and no list, present means enabled. Astra adds nothing
# there and tells nothing: a passive loader, which its own root may anchor (§7.4).
[[mods.loader]]
id = "unreal-paks"
name = "Unreal ~mods paks"
codes = ["unreal"]
source = ["game"]
require = [
  { child = "{source}/{project}/Content/Paks/~mods", kind = "dir" },
]
root = "{source}/{project}/Content/Paks/~mods"
enabled = [ { format = "file-glob", glob = "*.pak" } ]
coexist = [ { strategy = "side-by-side" } ]

[package]
name = "astra-game-launcher"
version = "0.5.2"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
description = "Puts a game-integration mod into a game and launches the game with it. Minimal, no UI."
repository = "https://github.com/mihailinl/astra-game-launcher"
readme = "README.md"
keywords = ["modding", "unity", "bepinex", "launcher", "proton"]
categories = ["games", "command-line-utilities"]

[lib]
name = "astra_game_launcher"
path = "src/lib.rs"

[[bin]]
name = "astra-game-launcher"
path = "src/bin/astra-game-launcher.rs"
required-features = ["cli"]

# The release-time probe: `compat` (a GI release against Astra 0.2.7 and launcher 0.3.1) and
# `validate-descriptor`. See the README's "gi-probe" section.
[[bin]]
name = "gi-probe"
path = "src/bin/gi-probe/main.rs"
required-features = ["gi-probe"]

[features]
default = ["cli"]
# The command-line program and its HTTP client. The daemon builds with
# `default-features = false` and injects its own `Fetch`.
cli = ["dep:ureq"]
# `gi-probe` links launcher 0.3.1 (what Astra 0.2.7 ships) as a normal dependency, so it is never
# a default: the daemon and the CLI never build 0.3.1 (`cargo tree -e normal --no-default-features`
# names no 9aa7874). `toml/display` rewrites a manifest without its `[integration.*]` tables.
gi-probe = ["dep:launcher_031", "dep:semver", "dep:toml_edit", "toml/display"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `unbounded_depth` lifts serde_json's own nesting limit (127) only where a reader asks: the content
# check holds glTF JSON to the content catalogue's 128 with its own visitor (`content::strict_value`).
serde_json = { version = "1", features = ["unbounded_depth"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
sha2 = "0.10"
hex = "0.4"
# 9.2, not 8: zip < 9.0.5 is the "zip cloaking" advisory. zip 9 does not refuse a cloaked archive
# on its own (`by_index` reads the central directory): `zip_consistency` does, before anything is
# read out of it, with flate2 (where a deflate stream ends) and crc32fast (a stored entry's scan).
# The same versions as zip's own, so they add nothing to the tree.
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
# The content catalogue's archive reader (`content::zipwalk`): NFC names (`ingest-v1.md` §3 step 4), and
# searching bytes. Both are in Astra's tree already (memchr is serde_json's and zip's).
unicode-normalization = "0.1.25"
memchr = "2"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
# gi-probe only (the feature above): launcher 0.3.1, the same rev as the dev-dependency below.
launcher_031 = { package = "astra-game-launcher", git = "https://github.com/mihailinl/astra-game-launcher", rev = "9aa7874b60f6b10bd67411b7aad40fcc968b78bc", default-features = false, optional = true }
# gi-probe only: Astra 0.2.7's tag rule (`releases::version_after`) is semver's.
semver = { version = "1", optional = true }
# gi-probe only: TOML 1.0, what the specification parses a manifest and a descriptor as
# (AstraPlugins `manifest.md` §2.6.1), beside `toml`, which reads TOML 1.1 (`gi-probe`'s
# `toml10`). 0.22 is the last toml_edit with a parser of its own: 0.23 parses through
# `toml_parser`, whose 1.1 releases read TOML 1.1 in the same semver range. `unbounded`: no
# nesting limit of its own; it reads only a text `toml` has read, so 80 deep at most.
toml_edit = { version = "0.22.27", default-features = false, features = ["parse", "unbounded"], optional = true }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW / O_NONBLOCK for reading a play-arm that may have been swapped for a link or a FIFO.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    # gi-probe only (a recording's replay, `tests/corpus/replay.rs`): FSCTL_SET_SPARSE.
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

# Test-only: a registered cloud-files sync root, for `reads::windows::tests` (debt row 3).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_CloudFilters",
    "Win32_System_CorrelationVector",
] }

[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Canary C1: the detector as launcher 0.4.1 shipped it (main 73bf11e), so a test can hold every
# Detection this crate makes against the one that commit makes, byte for byte. Never a runtime
# dependency; never moved: a new pin would compare against itself.
launcher_legacy = { package = "astra-game-launcher", git = "https://github.com/mihailinl/astra-game-launcher", rev = "73bf11e32d83b88704175411f765806aaa7bac3f", default-features = false }
# Canary C1b's upgrade path: launcher 0.3.1 (v0.3.1, 9aa7874), what Astra 0.2.7 ships, so the
# ledger of every game an Astra 0.2.7 user installed was written by it. A test installs with it and
# plans again with this crate. Never a runtime dependency; never moved: the rev is that release.
launcher_031 = { package = "astra-game-launcher", git = "https://github.com/mihailinl/astra-game-launcher", rev = "9aa7874b60f6b10bd67411b7aad40fcc968b78bc", default-features = false }
# The mods identity canary (`tests/mods_identity.rs`): launcher 0.5.0 (v0.5.0, 6d1851b), whose
# `src/mods/**` found the player's mods with hand-written code. 0.5.1 finds them through the
# built-in `mods` data, and the canary holds its answers to 0.5.0's. Never a runtime dependency;
# never moved: a new pin would compare against itself.
launcher_050 = { package = "astra-game-launcher", git = "https://github.com/mihailinl/astra-game-launcher", rev = "6d1851b6d86f3dea4ef2e1a06d26b583530a040a", default-features = false }

# The C1 canary runs launcher 0.4.1 (a dependency, above) beside this crate over 20,000 game
# folders: dependencies are built optimised in this repository's own dev and test builds (a
# crate depending on this one never reads its profiles), so the gate takes minutes, not tens.
[profile.dev.package."*"]
opt-level = 2

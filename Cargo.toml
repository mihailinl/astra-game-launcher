[package]
name = "astra-game-launcher"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
description = "Puts a game-integration mod into a game and launches the game with it. Minimal, no UI."
repository = "https://github.com/mihailinl/astra-game-launcher"
readme = "README.md"
keywords = ["modding", "unity", "bepinex", "launcher", "proton"]
categories = ["games", "command-line-utilities"]

[lib]
name = "astra_game_launcher"
path = "src/lib.rs"

[[bin]]
name = "astra-game-launcher"
path = "src/bin/astra-game-launcher.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line program and its HTTP client. The daemon builds with
# `default-features = false` and injects its own `Fetch`.
cli = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW / O_NONBLOCK for reading a play-arm that may have been swapped for a link or a FIFO.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
] }

[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Canary C1: the detector as launcher 0.4.1 shipped it (main 73bf11e), so a test can hold every
# Detection this crate makes against the one that commit makes, byte for byte. Never a runtime
# dependency; never moved: a new pin would compare against itself.
launcher_legacy = { package = "astra-game-launcher", git = "https://github.com/mihailinl/astra-game-launcher", rev = "73bf11e32d83b88704175411f765806aaa7bac3f", default-features = false }
# Canary C1b's upgrade path: launcher 0.3.1 (v0.3.1, 9aa7874), what Astra 0.2.7 ships, so the
# ledger of every game an Astra 0.2.7 user installed was written by it. A test installs with it and
# plans again with this crate. Never a runtime dependency; never moved: the rev is that release.
launcher_031 = { package = "astra-game-launcher", git = "https://github.com/mihailinl/astra-game-launcher", rev = "9aa7874b60f6b10bd67411b7aad40fcc968b78bc", default-features = false }

# The C1 canary runs launcher 0.4.1 (a dependency, above) beside this crate over 20,000 game
# folders: dependencies are built optimised in this repository's own dev and test builds (a
# crate depending on this one never reads its profiles), so the gate takes minutes, not tens.
[profile.dev.package."*"]
opt-level = 2
